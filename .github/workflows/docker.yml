name: Docker CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  IMAGE: ministatus

jobs:
  build-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Lint du Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build de l'image
        run: docker build --build-arg APP_VERSION=ci -t ${{ env.IMAGE }}:ci .

      - name: Tests dans le conteneur
        run: docker run --rm ${{ env.IMAGE }}:ci python -m unittest -v

      - name: Rapport Trivy (JSON)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: json
          output: trivy-report.json
          exit-code: "0"

      # Étape remplacée : Génération d'un rapport SARIF (plus fiable que HTML)
      - name: Rapport Trivy (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: "0"

      - name: Resume dans la page du run
        if: always()
        run: |
          echo "### Rapport Trivy" >> "$GITHUB_STEP_SUMMARY"
          if [ -f trivy-report.json ]; then
            for s in CRITICAL HIGH MEDIUM; do
              n=$(jq "[.Results[]?.Vulnerabilities[]? | select(.Severity=='$s')] | length" trivy-report.json)
              echo "- $s : $n" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "Le fichier trivy-report.json n'a pas été généré." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-report.json
            trivy-results.sarif

      # Étape d'upload du rapport SARIF vers GitHub Security
      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Quality gate (HIGH et CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          severity: HIGH,CRITICAL
          vuln-type: library
          ignore-unfixed: true
          exit-code: "1"

  publish:
    needs: build-scan
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ministatus
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build et push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}